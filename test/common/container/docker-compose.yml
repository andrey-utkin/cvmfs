version: '3'

services:
    cvmfs-dev:
        image: registry.cern.ch/cvmfs-dev:latest
        container_name: cvmfs-dev
        hostname: cvmfs-dev
        privileged: true
        build:
            context: .
            dockerfile: Dockerfile-dev
        volumes:
            - /sys/fs/cgroup:/sys/fs/cgroup
            - var_spool_cvmfs:/var/spool/cvmfs
            - ../../../:/home/sftnight/cvmfs
            - ../../../../ccache:/home/sftnight/.ccache
            - ../../../../tmp_cvmfs-build:/tmp/cvmfs-build
            - ../../../../tmp_cvmfs-ext:/tmp/cvmfs-ext
volumes:
    var_spool_cvmfs:
