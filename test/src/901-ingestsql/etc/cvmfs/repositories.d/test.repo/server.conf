CVMFS_ASYNC_SCRATCH_CLEANUP=true
CVMFS_SERVER_CATALOG_CACHE=on
CVMFS_AUTO_GC=false
CVMFS_AUTO_REPAIR_MOUNTPOINT=true
CVMFS_AUTO_TAG=true
CVMFS_AUTO_TAG_TIMESPAN="3 days ago"
CVMFS_AUTOCATALOGS=true
CVMFS_AUTOCATALOGS_MIN_WEIGHT=10
CVMFS_AVG_CHUNK_SIZE=8388608
CVMFS_COMPRESSION_ALGORITHM=default
CVMFS_CREATOR_VERSION=142
CVMFS_EXTERNAL_DATA=true
CVMFS_FORCE_REMOUNT_WARNING=false
CVMFS_GARBAGE_COLLECTION=true
CVMFS_GATEWAY_SAVE_STATS=false
CVMFS_GENERATE_LEGACY_BULK_CHUNKS=false
CVMFS_HASH_ALGORITHM=sha1
CVMFS_IGNORE_XDIR_HARDLINKS=true
CVMFS_INCLUDE_XATTRS=true
CVMFS_MAX_CHUNK_SIZE=16777216
CVMFS_MIN_CHUNK_SIZE=4194304
CVMFS_PRINT_STATISTICS=false
CVMFS_REPOSITORY_NAME=test.repo
CVMFS_REPOSITORY_TTL=20
CVMFS_REPOSITORY_TYPE=stratum0
CVMFS_SERVER_PROXY=http://127.0.0.1:8088
CVMFS_SPOOL_DIR=/var/spool/cvmfs/test.repo
CVMFS_STRATUM0=http://127.0.0.1:8000/test.repo/test.repo/
CVMFS_TRUSTED_CERTS=/etc/cvmfs/repositories.d/test.repo/trusted_certs
CVMFS_UNION_DIR=/cvmfs/test.repo
CVMFS_UNION_FS_TYPE=overlayfs
CVMFS_UPSTREAM_STORAGE=S3,/var/spool/cvmfs/test.repo/tmp,test.repo@/etc/cvmfs/repositories.d/test.repo/s3.conf
CVMFS_USE_FILE_CHUNKING=true
CVMFS_USER=root
CVMFS_VIRTUAL_DIR=false
